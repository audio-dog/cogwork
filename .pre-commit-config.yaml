# `pnpm install` installs the shims named here. Adding a hook type needs another `pnpm install`.
# The shim is shared by every worktree, so it is installed with `--allow-missing-config`: a worktree
# on a branch from before this file must still be able to commit.
default_install_hook_types: [commit-msg]

repos:
  # Pinned to the commit of v4.4.0, because a tag can move.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
