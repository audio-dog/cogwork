packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  '@google/genai': false
  '@openrouter/sdk': false
  electron: true
  electron-winstaller: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: false

catalog:
  '@effect/tsgo': '0.24.3'
  '@tanstack/ai': '0.44.0'
  '@tanstack/ai-codex': '0.3.2'
  '@tanstack/ai-sandbox': '0.3.2'
  '@tanstack/ai-sandbox-local-process': '0.2.1'
  '@tailwindcss/vite': '^4.3.3'
  '@types/node': '^24.13.3'
  '@types/react': '^19.2.7'
  '@types/react-dom': '^19.2.3'
  react: '^19.2.6'
  react-dom: '^19.2.6'
  typescript: ^7.0.2
  vitest: '^4.1.10'

catalogs:
  effect:
    effect: '4.0.0-rc.110'
    '@effect/atom-react': '4.0.0-rc.110'
    '@effect/opentelemetry': '4.0.0-rc.110'
    '@effect/platform-node': '4.0.0-rc.110'
    '@effect/vitest': '4.0.0-rc.110'

minimumReleaseAgeExclude:
  - '@tanstack/ai-acp@0.2.6'
  - '@tanstack/ai-persistence@0.1.3'
  - '@tanstack/ai-sandbox@0.3.2'
