packages:
  - 'packages/*'
  - 'apps/*'
  - 'configs/*'

allowBuilds:
  '@google/genai': false
  '@openrouter/sdk': false
  electron: true
  electron-winstaller: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: false

catalog:
  '@effect/tsgo': '0.73.2'
  drizzle-orm: '1.0.0-rc.5'
  drizzle-kit: '1.0.0-rc.5'
  '@tanstack/ai': '1.0.0'
  '@tanstack/ai-acp': '1.0.0'
  '@tanstack/ai-anthropic': '1.0.0'
  '@tanstack/ai-claude-code': '1.0.0'
  '@tanstack/ai-codex': '1.0.0'
  '@tanstack/ai-gemini': '1.0.0'
  '@tanstack/ai-openai': '1.0.0'
  '@tanstack/ai-sandbox': '1.0.0'
  '@tanstack/ai-sandbox-local-process': '1.0.0'
  '@tanstack/ai-skills': '1.0.0'
  '@tanstack/ai-persistence': '1.0.0'
  '@tanstack/highlight': ^1.2.12
  '@tailwindcss/vite': ^4.3.5
  '@types/node': '^26.6.6'
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  react: ^19.3.1
  react-dom: ^19.3.1
  tsx: '^4.23.13'
  turbo: '^2.10.12'
  typescript: ^7.0.2
  # @effect/vitest@4.1 needs vitest 5. @tanstack/ai-persistence, ai-sandbox, and ai-skills 1.0.0
  # still name an optional vitest ^4 peer for their unused testkits; pnpm reports it as unmet.
  vitest: '^5.1.0'

catalogs:
  effect:
    effect: '4.1.4'
    '@effect/atom-react': '4.1.4'
    '@effect/opentelemetry': '4.1.4'
    '@effect/platform-node': '4.1.4'
    '@effect/sql-sqlite-node': '4.1.4'
    '@effect/vitest': '4.1.4'
permissions:
  '@tanstack/ai':
    skills: true
  '@tanstack/ai-persistence':
    skills: true
  '@tanstack/ai-sandbox':
    skills: true
  '@tanstack/ai-skills':
    skills: true
  '@tanstack/devtools-vite':
    skills: true
  '@tanstack/highlight':
    skills: true
  '@tanstack/markdown':
    skills: true
  '@tanstack/router-plugin':
    skills: true
  drizzle-kit:
    skills: true
