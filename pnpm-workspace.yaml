packages:
  - 'packages/*'
  - 'apps/*'
  - 'configs/*'

allowBuilds:
  '@google/genai': false
  '@openrouter/sdk': false
  electron: true
  electron-winstaller: true
  esbuild: true
  msgpackr-extract: true
  protobufjs: false

catalog:
  '@effect/tsgo': '0.38.0'
  # drizzle-orm@1.0.0-rc.4 calls the beta-only `Schema.TaggedErrorClass` from its Effect driver, so
  # `drizzle-orm/effect-sqlite-node` cannot be imported on the rc line at all. The rc5-tag build
  # below calls `Schema.TaggedError` and loads. Move to the release that carries that fix.
  drizzle-orm: '1.0.0-rc.5-169397b'
  drizzle-kit: '1.0.0-rc.4'
  '@tanstack/ai': '1.0.0'
  '@tanstack/ai-acp': '1.0.0'
  '@tanstack/ai-anthropic': '1.0.0'
  '@tanstack/ai-claude-code': '1.0.0'
  '@tanstack/ai-codex': '1.0.0'
  '@tanstack/ai-gemini': '1.0.0'
  '@tanstack/ai-openai': '1.0.0'
  '@tanstack/ai-sandbox': '1.0.0'
  '@tanstack/ai-sandbox-local-process': '1.0.0'
  '@tanstack/ai-persistence': '1.0.0'
  '@tanstack/highlight': '^1.2.0'
  '@tailwindcss/vite': '^4.3.3'
  '@types/node': '^24.13.3'
  '@types/react': '^19.2.7'
  '@types/react-dom': '^19.2.5'
  react: '^19.2.6'
  react-dom: '^19.2.6'
  tsx: '^4.23.13'
  turbo: '^2.10.12'
  typescript: ^7.0.2
  vitest: '^4.1.10'

catalogs:
  effect:
    effect: '4.0.0-rc.112'
    '@effect/atom-react': '4.0.0-rc.112'
    '@effect/opentelemetry': '4.0.0-rc.112'
    '@effect/platform-node': '4.0.0-rc.112'
    '@effect/sql-sqlite-node': '4.0.0-rc.112'
    '@effect/vitest': '4.0.0-rc.112'
