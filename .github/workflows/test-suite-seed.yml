name: Test Suite Seed

on:
  push:
    branches: ['main']

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          cache: true

      - name: Cache for Turbo
        uses: rharkor/caching-for-turbo@v2.5.0

      - name: Run tests and save the cache
        run: pnpm exec turbo run test
