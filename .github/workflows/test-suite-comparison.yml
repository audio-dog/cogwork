name: Test Suite Comparison

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base commit
        required: true
        type: string
      head_ref:
        description: Head commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          cache: true

      - name: Compare test suite duration
        env:
          BASE_REF: ${{ inputs.base_ref }}
          HEAD_REF: ${{ inputs.head_ref }}
        shell: bash
        run: pnpm --silent test:compare "$BASE_REF" "$HEAD_REF" | tee test-suite-comparison.json

      - name: Upload test suite comparison
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-suite-comparison
          path: test-suite-comparison.json
