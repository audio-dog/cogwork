name: Test Suite Comparison

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base commit
        required: true
        type: string
      head_ref:
        description: Head commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          cache: true

      - name: Compare test suite duration
        env:
          BASE_REF: ${{ inputs.base_ref }}
          HEAD_REF: ${{ inputs.head_ref }}
        shell: bash
        run: pnpm --silent --filter @cogwork/sensor test:compare "$BASE_REF" "$HEAD_REF" | tee test-suite-comparison.json

      - name: Write test suite timing summary
        shell: bash
        run: node configs/sensor/test-measure-summary.mjs test-suite-comparison.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test suite comparison
        uses: actions/upload-artifact@v7
        with:
          name: test-suite-comparison
          path: test-suite-comparison.json
