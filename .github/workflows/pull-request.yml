name: Pull Request Checks

on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize]
  merge_group:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          cache: true

  test:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          cache: true

      - name: Cache for Turbo
        uses: rharkor/caching-for-turbo@v2.5.0

      - name: Run tests
        run: pnpm --silent --filter @cogwork/sensor test:measure > test-suite-measurement.json

      - name: Write test suite summary
        if: ${{ !cancelled() }}
        run: node scripts/test-measure-summary.mjs test-suite-measurement.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test suite measurement
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-suite-measurement
          path: test-suite-measurement.json

  format-and-lint:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          cache: true

      - name: Format and lint
        run: pnpm format-and-lint

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          cache: true

      - name: Cache for Turbo
        uses: rharkor/caching-for-turbo@v2.5.0

      - name: Typecheck
        run: pnpm typecheck

  build:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          cache: true

      - name: Cache for Turbo
        uses: rharkor/caching-for-turbo@v2.5.0

      - name: Build
        run: pnpm build
