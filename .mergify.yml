queue_rules:
  - name: default
    merge_method: merge
    queue_conditions:
      - base = main
      - check-success = test
      - check-success = format-and-lint
      - check-success = typecheck
      - check-success = build
      # Lint Rule Fixtures runs only when its paths change.
      - or:
          - check-success = lint-rule-fixtures
          - and:
              - -files = biome.json
              - -files ~= ^configs/lint/

pull_request_rules:
  - name: Queue labeled pull requests
    conditions:
      - label = queue
    actions:
      queue:
